[package]
name = "llmnop"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "A command-line tool for benchmarking the performance of LLM inference endpoints."
license = "Apache-2.0"
homepage = "https://github.com/jpreagan/llmnop"
repository = "https://github.com/jpreagan/llmnop"
readme = "README.md"
keywords = ["llm", "benchmark", "performance", "openai", "inference"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/*", ".agents/*", ".claude/*", ".github/*", "AGENTS.md", "CLAUDE.md", "dist-workspace.toml"]

[dependencies]
anyhow = "1.0.104"
eventsource-stream = "0.2.3"
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases"], optional = true }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.2"
rand_distr = "0.6.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", features = ["http", "rustls-tls"] }
tokio = { version = "1.53.1", features = ["full"] }
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
directories = "6.0.0"

[features]
self-update = ["dep:axoupdater"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
